[metadata]
name = runregistar
version = attr: runregistar.__version__
author = Keith Gorlen
author_email = kgorlen@gmail.com
description = Stack and optionally combine astronomical images using Auriga RegiStar.
long_description = file: README.md, LICENSE.txt
url = https://github.com/kgorlen/RunRegiStar
keywords = RegiStar, Astronomy, Image Processing, Milky Way
license = GPL-3.0-or-later
classifiers = 
    Programming Language :: Python :: 3.12
    Operating System :: OS Independent
    
[options]
package_dir=
    =src
packages = find:
python_requires = >=3.12

[options.packages.find]
where=src

[options.entry_points]
console_scripts =
    runregistar-reg = runregistar.runregistar:register_op
    runregistar-stack = runregistar.runregistar:stack_op
